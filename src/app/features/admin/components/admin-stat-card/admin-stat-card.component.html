<div class="admin-stat-card">
  @if (icon(); as iconName) {
    <span class="admin-stat-card__icon-tile" aria-hidden="true">
      <app-icon [name]="iconName" [size]="18" />
    </span>
  }
  <div class="admin-stat-card__body">
    @if (value() !== null) {
      <span class="admin-stat-card__value">{{ value() }}</span>
    } @else {
      <span class="admin-stat-card__value-skeleton" aria-hidden="true"></span>
    }
    <span class="admin-stat-card__label">{{ label() }}</span>
    @if (subLabel()) {
      <span class="admin-stat-card__sub" [class]="'admin-stat-card__sub--' + subTone()">{{
        subLabel()
      }}</span>
    }
  </div>
</div>
