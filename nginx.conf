server {
    listen 80;
    server_name _;

    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based responses
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Runtime-loaded ngx-translate bundles (/i18n/*.json).
    # These are NOT content-hashed: the filename stays en.json/ru.json/hy.json across
    # deploys, so without an explicit Cache-Control they inherit an empty header from
    # `location /` and browsers heuristically cache them (Last-Modified / 10). A deploy
    # then ships new hash-named JS against stale translations and the app renders raw
    # keys for returning visitors.
    # `^~` matters: it stops nginx from evaluating the regex asset-cache block below,
    # which would otherwise win for any i18n file whose extension it lists (e.g. .svg)
    # and hand it `immutable`. Query strings (the build's ?v= stamp) are not part of the
    # matched URI, so this block matches /i18n/en.json?v=<hash> too.
    # No `expires` here on purpose — ETag/Last-Modified stay on, so repeat loads are 304s,
    # and gzip is inherited from the server block (application/json is in gzip_types).
    location ^~ /i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Long-lived cache for content-hashed build assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the app shell so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy API and file uploads to the backend container
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_set_header Host $host;
    }

    # SignalR chat hub — WebSocket upgrade + SSE/long-poll fallback.
    # Without this the /hubs/chat negotiate falls into the SPA fallback below
    # and returns 405, killing realtime chat in the docker stack (M-008).
    # $connection_upgrade comes from the map in conf.d/00-map.conf (http context).
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_buffering off;
    }

    # SPA routing: fall unknown routes back to the Angular app shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
